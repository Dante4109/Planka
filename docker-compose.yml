services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    container_name: planka
    restart: unless-stopped
    ports:
      - "1337:1337"
    volumes:
      - planka_user_avatars:/app/public/user-avatars
      - planka_project_backgrounds:/app/public/project-background-images
      - planka_attachments:/app/private/attachments
    env_file:
      - .env
    extra_hosts:
      # Allows the container to reach the host Windows machine's PostgreSQL
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1337 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  planka_user_avatars:
  planka_project_backgrounds:
  planka_attachments:

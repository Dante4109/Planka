services:
  planka:
    image: ghcr.io/plankanban/planka:latest
    container_name: planka
    restart: unless-stopped
    ports:
      - "1337:1337"
    volumes:
      - planka_user_avatars:/app/public/user-avatars
      - planka_project_backgrounds:/app/public/project-background-images
      - planka_attachments:/app/private/attachments
    env_file:
      - .env
    extra_hosts:
      # Allows the container to reach the host Windows machine's PostgreSQL
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1337 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  planka-webhook:
    build: .
    container_name: planka-webhook
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      # Override BASE_URL with the Docker-internal address so the webhook container
      # can reach the Planka API without going through the host network.
      - PLANKA_INTERNAL_URL=http://planka:1337
    depends_on:
      planka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5001/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  planka_user_avatars:
  planka_project_backgrounds:
  planka_attachments:

